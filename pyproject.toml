[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "storage-health"
version = "0.1.0"
description = "Cross-platform storage health telemetry with normalized output"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tom Baty" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]
windows = ["psutil>=5.9", "pystray>=0.19.5", "Pillow>=10"]

[project.scripts]
storage-health = "storage_health.cli:main"

[project.gui-scripts]
ssd-monitor-tray = "storage_health.windows_tray:main"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_health"]

[tool.ruff]
line-length = 100
target-version = "py310"
